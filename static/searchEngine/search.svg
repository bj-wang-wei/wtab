<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="handleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
  </defs>

  <!-- 放大镜圆形（蓝色渐变） -->
  <circle cx="28" cy="28" r="18" fill="url(#glassGradient)" stroke="#01579B" stroke-width="2"/>
  
  <!-- 内部高光 -->
  <circle cx="24" cy="24" r="6" fill="#FFFFFF" opacity="0.35"/>
  
  <!-- 放大镜手柄（橙色渐变） -->
  <rect x="40" y="40" width="18" height="6" rx="3" 
        transform="rotate(45 40 40)" 
        fill="url(#handleGradient)" stroke="#BF360C" stroke-width="1.5"/>
</svg>